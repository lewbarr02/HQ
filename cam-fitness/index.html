<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

<script>
'use strict';
const e = React.createElement;
const {useState, useEffect, useRef} = React;

// ── Backend ──────────────────────────────────────────────────────────────────
// Reuses the same Supabase project as the Brittanie fork (separate from Lewis's
// personal HQ project). Cam's rows are scoped by user_id:'cam' in the shared
// hq_data key/value table, so his data never mixes with Lewis's or Brittanie's.
const _SB = supabase.createClient(
  'https://axybbtnkihoqwcmmmwae.supabase.co',
  'sb_publishable_vYCFYjguIei_WXAHN5ig2Q_y1z45Sjl'
);
const CAM_USER = 'cam';
// Local cache is namespaced with `cam_` (not `hq_`) so that if this app is ever
// opened on a device that also has the main HQ app or the Brittanie fork, their
// localStorage never collides. Supabase rows stay keyed by the bare name, scoped
// by user_id:'cam'.
const LS = 'cam_';

const ACCENT="#00C6FF", PURPLE="#7B2FFF", MUTED="#8E8EAA", TEXT="#1A1833", CARD2="#F0F2F8", BORDER="rgba(100,80,220,0.18)";
const GREEN="#10B981";

// ── Storage: localStorage first, mirrored to Supabase on every write ──────────
function save(k, v) {
  try { localStorage.setItem(LS + k, JSON.stringify(v)); } catch (ex) {}
  _SB.from('hq_data')
    .upsert({ user_id: CAM_USER, key: k, value: v, updated_at: new Date().toISOString() }, { onConflict: 'user_id,key' })
    .then(({ error }) => {
      if (error) console.warn('SB save error', k, error);
      else { try { localStorage.setItem(LS + 'lastCloudSync', new Date().toISOString()); } catch (ex) {} }
    });
}
function load(k) {
  try { const s = localStorage.getItem(LS + k); return s ? JSON.parse(s) : null; } catch (ex) { return null; }
}
function today() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

// Pull the cloud snapshot down into localStorage (used on load + manual Restore).
async function syncFromSupabase() {
  const { data, error } = await _SB.from('hq_data').select('key,value').eq('user_id', CAM_USER);
  if (error || !data) return false;
  data.forEach(row => {
    try { localStorage.setItem(LS + row.key, JSON.stringify(row.value)); } catch (ex) {}
  });
  return true;
}
// Force-upload every hq_ key from this device (the "Push to Cloud" step).
async function pushAllToSupabase() {
  const keys = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith(LS) && k !== LS + 'lastCloudSync') keys.push(k.slice(LS.length));
  }
  const rows = keys.map(k => {
    const v = load(k);
    return v !== null ? { user_id: CAM_USER, key: k, value: v, updated_at: new Date().toISOString() } : null;
  }).filter(Boolean);
  if (!rows.length) return;
  const { error } = await _SB.from('hq_data').upsert(rows, { onConflict: 'user_id,key' });
  if (error) console.warn('pushAllToSupabase error', error);
}

// ── Sequential workout counter ───────────────────────────────────────────────
// Calendar-free, same reasoning as Lewis's own program: a missed session never
// penalises the schedule — you always just pick up at the next workout in the
// rotation. workoutCount = workouts completed so far (starts at 0).
const ROTATION = ['Day A', 'Day B', 'Day C'];
const BLOCK_LENGTH = 12; // Month 1 = 12 sessions (3/wk x 4wk). Adjust freely.
function rotationIndex(count) { return ((count % 3) + 3) % 3; }
function nextDayLabel(count) { return ROTATION[rotationIndex(count)]; }
function blockNumber(count) { return Math.floor(count / BLOCK_LENGTH) + 1; }
function positionInBlock(count) { return (count % BLOCK_LENGTH) + 1; } // 1..BLOCK_LENGTH

// ── Exercise Bank types (weight / reps / time), same structure as HQ ─────────
const EX_TYPE_LABEL = { weight: 'Weight', reps: 'Reps', time: 'Time' };
function exTargetText(ex) {
  const s = ex.sets || 3;
  if (ex.type === 'time') return s + ' × ' + (ex.repsText || (ex.targetSecs ? ex.targetSecs + ' sec' : '—'));
  const rep = ex.repsText || (ex.reps != null ? ex.reps : 10);
  if (ex.type === 'reps') return s + ' × ' + rep;
  return s + ' × ' + rep + (ex.targetWeight != null ? ' @ ' + ex.targetWeight + ' lb' : '');
}

// ── Cam's program (localStorage seed → Push to Cloud) ────────────────────────
function accessoryBlock() {
  return [
    { name: 'Knee-to-wall ankle mobility', type: 'reps', sets: 2, repsText: '10 / side', targetWeight: null, accessory: true,
      note: 'Ankle mobility — drive the knee past the toes without the heel lifting.' },
    { name: 'Band lateral walks', type: 'reps', sets: 2, repsText: '10 steps / direction', targetWeight: null, accessory: true,
      note: 'Band above the knees, athletic stance, keep tension the whole set.' },
    { name: 'Bodyweight box squat to bench', type: 'reps', sets: 2, repsText: '10', targetWeight: null, accessory: true,
      note: 'Coaching cue: heels down, knees out. Sit back to the bench, stand tall. No added load.' },
    { name: 'Glute bridge', type: 'reps', sets: 2, repsText: '12', targetWeight: null, accessory: true,
      note: 'Squeeze the glutes hard at the top, ribs down.' },
  ];
}

function seedCamProgram() {
  if (load('camProfile')) return; // first run only

  const program = {
    split: '3-day full body rotation (Day A / B / C)',
    daysPerWeek: 3,
    blockLength: BLOCK_LENGTH,
    generatedAt: new Date().toISOString(),
    progressionRule:
      'Only progress a lift once Cam hits a clean 3×10 across ALL sets. When progressing, add the smallest ' +
      'available plate increment only — never add weight and volume in the same week. Month 1 success = attendance ' +
      '+ clean reps, NOT weight increases. Do not chase weight jumps just because a week has passed. ' +
      'Squats are on hold (ankle mobility + knee cave) — Leg Press and Leg Extension replace them until the ' +
      'corrective work fixes the pattern.',
    days: [
      {
        dayLabel: 'Day A',
        focus: ['Full body', 'Press · Pull · Leg Press'],
        exercises: [
          { name: 'Chest Press Machine', type: 'weight', sets: 3, reps: 10, targetWeight: 25, note: '25 lb per side.' },
          { name: 'Lat Pulldown Machine', type: 'weight', sets: 3, reps: 10, targetWeight: 25, note: '25 lb per side.' },
          { name: 'DB Shoulder Press', type: 'weight', sets: 3, reps: 10, targetWeight: 10, note: '10 lb dumbbells.' },
          { name: 'Leg Press', type: 'weight', sets: 3, reps: 10, targetWeight: null,
            note: 'Session 1: find a baseline working weight. Progress in +20 lb steps, and only after a clean 3×10. Replaces squats for now.' },
          { name: 'Plank', type: 'time', sets: 3, repsText: '20–30 sec', targetSecs: 25, targetWeight: null,
            note: 'Brace hard, straight line head to heels.' },
        ],
      },
      {
        dayLabel: 'Day B',
        focus: ['Full body', 'DB press · Rows · Quads'],
        exercises: [
          { name: 'Bench Press (DB)', type: 'weight', sets: 3, reps: 10, targetWeight: 65,
            note: 'Confirm on session 1 whether 65 lb is total or per dumbbell, then set the working weight.' },
          { name: 'Lat Pulldown (cable)', type: 'weight', sets: 3, reps: 10, targetWeight: 70 },
          { name: 'Leg Extension', type: 'weight', sets: 3, reps: 10, targetWeight: 40, note: 'Replaces squats for now — controlled, no kicking.' },
          { name: 'Seated Row', type: 'weight', sets: 3, reps: 10, targetWeight: null, note: 'Session 1: find the working weight. Progress only after a clean 3×10.' },
          { name: 'Dead Bug', type: 'reps', sets: 3, repsText: '10 / side', targetWeight: null, note: 'Low back stays flat on the floor the whole set.' },
        ],
      },
      {
        dayLabel: 'Day C',
        focus: ['Full body', 'Leg Press · Press · Pull'],
        exercises: [
          { name: 'Leg Press', type: 'weight', sets: 3, reps: 10, targetWeight: null, note: 'Match the working weight you used on Day A.' },
          { name: 'Chest Press Machine', type: 'weight', sets: 3, reps: 10, targetWeight: 25, note: '25 lb per side.' },
          { name: 'Lat Pulldown (cable)', type: 'weight', sets: 3, reps: 10, targetWeight: 70 },
          { name: 'DB Shoulder Press', type: 'weight', sets: 3, reps: 10, targetWeight: 10, note: '10 lb dumbbells.' },
          { name: 'Leg Extension', type: 'weight', sets: 3, reps: 10, targetWeight: 40, note: 'Replaces squats for now — controlled, no kicking.' },
        ],
      },
    ],
  };
  // Append the every-session corrective / accessory block to each day.
  program.days.forEach(d => { d.exercises = d.exercises.concat(accessoryBlock()); });

  // A flat Exercise Bank view of everything in the program (weight / reps / time),
  // kept so the type structure matches the main HQ app.
  const bank = [];
  const seen = {};
  program.days.forEach(d => d.exercises.forEach(ex => {
    if (seen[ex.name]) return;
    seen[ex.name] = true;
    bank.push({ name: ex.name, type: ex.type, category: ex.accessory ? 'Mobility / Corrective' : 'Main lift', note: ex.note || '' });
  }));

  save('currentProgram', program);
  save('exerciseBank', bank);
  save('workoutCount', load('workoutCount') == null ? 0 : load('workoutCount'));
  save('workoutLog', load('workoutLog') || {});
  save('camProfile', {
    name: 'Cam', age: 18, sex: 'male', heightIn: 72, startWeightLb: 290,
    goal: 'General strength + habit building (not aesthetics)',
    trains: '3x / week at the YMCA',
    notes: 'Beginner, first structured program. Squats on hold — ankle mobility + knee tracking.',
    createdAt: new Date().toISOString(),
  });
}
seedCamProgram();

// ── Progress-readiness (on-device hint, no AI) ───────────────────────────────
// Green flag only. Never auto-bumps the number — Cam's coach makes the actual call.
function lastSessionForDay(workoutLog, dayLabel) {
  const dates = Object.keys(workoutLog || {}).filter(d => (workoutLog[d] || []).length).sort().reverse();
  for (const d of dates) {
    const sess = (workoutLog[d] || []).filter(s => s.programDay && s.programDay.indexOf(dayLabel) !== -1);
    if (sess.length) return { date: d, session: sess[sess.length - 1] };
  }
  return null;
}
function prevSetsForExercise(workoutLog, dayLabel, exName, beforeDate) {
  const dates = Object.keys(workoutLog || {}).filter(d => !beforeDate || d < beforeDate).sort().reverse();
  for (const d of dates) {
    const sessions = workoutLog[d] || [];
    for (const s of sessions) {
      if (s.programDay && s.programDay.indexOf(dayLabel) !== -1) {
        const m = (s.exercises || []).find(x => x.name === exName);
        if (m && m.allSets && m.allSets.length) return { date: d, sets: m.allSets };
      }
    }
  }
  return null;
}
// Returns 'weight' when a weight lift with a known working weight has hit a clean
// 3x10 (>=3 logged sets, all >=10 reps) in its most recent session; else null.
function progressReady(workoutLog, dayLabel, ex) {
  if (ex.type !== 'weight' || ex.targetWeight == null) return null;
  const last = lastSessionForDay(workoutLog, dayLabel);
  if (!last) return null;
  const m = (last.session.exercises || []).find(x => x.name === ex.name);
  if (!m || !m.allSets || m.allSets.length < 3) return null;
  return m.allSets.every(s => (s.reps || 0) >= 10) ? 'weight' : null;
}

// ── Live Workout ─────────────────────────────────────────────────────────────
const WIP_KEY = LS + 'wipWorkout';
function readWip() { try { return JSON.parse(localStorage.getItem(WIP_KEY) || 'null'); } catch (ex) { return null; } }
function writeWip(o) { try { localStorage.setItem(WIP_KEY, JSON.stringify(o)); } catch (ex) {} }
function clearWip() { try { localStorage.removeItem(WIP_KEY); } catch (ex) {} }

function LiveWorkout({ day, dateStr, workoutLog, onFinish, onCancel }) {
  const wip = readWip();
  const resuming = wip && wip.dayLabel === day.dayLabel && wip.date === dateStr;

  const [startedAt] = useState(() => (resuming ? wip.startedAt : Date.now()));
  const [elapsed, setElapsed] = useState(() => Math.floor((Date.now() - (resuming ? wip.startedAt : Date.now())) / 1000));
  const [sets, setSets] = useState(() => {
    if (resuming) return wip.sets;
    const init = {};
    (day.exercises || []).forEach(ex => {
      init[ex.name] = Array.from({ length: ex.sets || 3 }, () => ({ done: false }));
    });
    return init;
  });
  const [draft, setDraft] = useState(() => (resuming ? (wip.draft || {}) : {}));
  const [timers, setTimers] = useState({});   // { exName: startEpoch } for time-based exercises
  const [rest, setRest] = useState(0);
  const [errors, setErrors] = useState({});

  // whole-session clock + rest countdown
  useEffect(() => {
    const iv = setInterval(() => {
      setElapsed(Math.floor((Date.now() - startedAt) / 1000));
      setRest(r => (r > 0 ? r - 1 : 0));
    }, 1000);
    return () => clearInterval(iv);
  }, [startedAt]);

  function persist(nextSets, nextDraft) {
    writeWip({ dayLabel: day.dayLabel, date: dateStr, startedAt: startedAt, sets: nextSets, draft: nextDraft });
  }
  function setDraftField(exName, field, val) {
    setDraft(prev => {
      const next = Object.assign({}, prev, { [exName]: Object.assign({}, prev[exName] || {}, { [field]: val }) });
      persist(sets, next);
      return next;
    });
  }
  function toggleTimer(exName) {
    setTimers(prev => {
      if (prev[exName]) {
        const secs = Math.max(0, Math.floor((Date.now() - prev[exName]) / 1000));
        setDraftField(exName, 'secs', String(secs));
        const n = Object.assign({}, prev); delete n[exName]; return n;
      }
      return Object.assign({}, prev, { [exName]: Date.now() });
    });
  }
  function logSet(ex) {
    const d = draft[ex.name] || {};
    let entry;
    if (ex.type === 'time') {
      const secs = parseInt(d.secs, 10);
      if (!secs) return setErrors(e2 => Object.assign({}, e2, { [ex.name]: 'Run the timer or type the seconds held.' }));
      entry = { secs: secs };
    } else if (ex.type === 'reps') {
      const reps = parseInt(d.reps, 10);
      if (!reps) return setErrors(e2 => Object.assign({}, e2, { [ex.name]: 'Enter reps to log this set.' }));
      entry = { reps: reps };
    } else {
      const w = d.weight, reps = parseInt(d.reps, 10);
      if (w === undefined || w === '' || !reps) {
        return setErrors(e2 => Object.assign({}, e2, { [ex.name]: 'Enter weight and reps to log this set.' }));
      }
      entry = { weight: parseFloat(w), reps: reps };
    }
    setErrors(e2 => { const n = Object.assign({}, e2); delete n[ex.name]; return n; });
    setSets(prev => {
      const arr = (prev[ex.name] || []).slice();
      const idx = arr.findIndex(s => !s.done);
      const slot = Object.assign({ done: true }, entry);
      if (idx === -1) arr.push(slot); else arr[idx] = slot;
      const next = Object.assign({}, prev, { [ex.name]: arr });
      // carry weight forward, clear reps/secs for the next set
      const nd = Object.assign({}, draft, { [ex.name]: ex.type === 'weight' ? { weight: d.weight, reps: '' } : {} });
      setDraft(nd);
      persist(next, nd);
      return next;
    });
    setRest(90);
  }

  const totalSets = (day.exercises || []).reduce((n, ex) => n + (sets[ex.name] ? sets[ex.name].length : (ex.sets || 3)), 0);
  const doneSets = Object.values(sets).reduce((n, arr) => n + arr.filter(s => s.done).length, 0);
  const pct = totalSets ? Math.round((doneSets / totalSets) * 100) : 0;
  const mm = String(Math.floor(elapsed / 60)).padStart(2, '0');
  const ss = String(elapsed % 60).padStart(2, '0');

  function finish() {
    const exercises = (day.exercises || []).map(ex => {
      const logged = (sets[ex.name] || []).filter(s => s.done);
      if (!logged.length) return null;
      const last = logged[logged.length - 1];
      const out = { name: ex.name, type: ex.type, accessory: !!ex.accessory, sets: logged.length };
      if (ex.type === 'time') {
        out.secs = last.secs != null ? last.secs : null;
        out.allSets = logged.map(s => ({ secs: s.secs != null ? s.secs : null }));
      } else if (ex.type === 'reps') {
        out.reps = last.reps != null ? last.reps : null;
        out.allSets = logged.map(s => ({ reps: s.reps != null ? s.reps : null }));
      } else {
        out.weight = last.weight != null ? last.weight : null;
        out.reps = last.reps != null ? last.reps : null;
        out.allSets = logged.map(s => ({ weight: s.weight != null ? s.weight : null, reps: s.reps != null ? s.reps : null }));
      }
      return out;
    }).filter(Boolean);

    const entry = {
      id: 'w' + Date.now(),
      programDay: day.dayLabel,
      date: dateStr,
      duration: Math.max(1, Math.round((Date.now() - startedAt) / 60000)),
      exercises: exercises,
    };
    clearWip();
    onFinish(entry);
  }

  return e('div', { style: { display: 'flex', flexDirection: 'column', height: '100%', background: '#12102B' } },
    // header
    e('div', { style: { padding: 'calc(14px + env(safe-area-inset-top)) 16px 12px', color: '#fff', flexShrink: 0 } },
      e('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10 } },
        e('button', { onClick: () => { if (confirm('Discard this workout? Logged sets will be lost.')) { clearWip(); onCancel(); } },
          style: { background: 'rgba(255,255,255,0.08)', border: '1px solid rgba(255,255,255,0.15)', color: '#fff', width: 34, height: 34, borderRadius: 10, fontSize: 15, cursor: 'pointer' } }, '✕'),
        e('div', { style: { fontSize: 13, fontWeight: 800, letterSpacing: 0.5 } }, day.dayLabel),
        e('div', { style: { fontVariantNumeric: 'tabular-nums', fontSize: 15, fontWeight: 800, color: ACCENT } }, mm + ':' + ss)
      ),
      e('div', { style: { height: 6, background: 'rgba(255,255,255,0.12)', borderRadius: 3, overflow: 'hidden' } },
        e('div', { style: { height: '100%', width: pct + '%', background: 'linear-gradient(90deg,' + ACCENT + ',' + PURPLE + ')', transition: 'width .3s' } })
      ),
      e('div', { style: { fontSize: 11, color: 'rgba(255,255,255,0.5)', marginTop: 6, fontWeight: 700 } }, doneSets + ' / ' + totalSets + ' sets' + (rest > 0 ? '   ·   rest ' + rest + 's' : ''))
    ),
    // body
    e('div', { style: { flex: 1, overflowY: 'auto', padding: '4px 12px 24px' } },
      ...(day.exercises || []).map(ex => {
        const arr = sets[ex.name] || [];
        const nextIdx = arr.findIndex(s => !s.done);
        const nextSetNum = nextIdx === -1 ? arr.length + 1 : nextIdx + 1;
        const prev = prevSetsForExercise(workoutLog, day.dayLabel, ex.name, dateStr);
        const prevForThis = prev && prev.sets[nextSetNum - 1] ? prev.sets[nextSetNum - 1] : null;
        const d = draft[ex.name] || {};
        const running = timers[ex.name];
        const runSecs = running ? Math.floor((Date.now() - running) / 1000) : null;
        return e('div', { key: ex.name, style: { background: ex.accessory ? 'rgba(255,255,255,0.04)' : 'rgba(255,255,255,0.07)', borderRadius: 16, padding: 14, marginBottom: 10, border: '1px solid rgba(255,255,255,0.08)' } },
          e('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', gap: 8 } },
            e('div', { style: { fontSize: 14, fontWeight: 800, color: '#fff' } }, ex.name),
            e('div', { style: { fontSize: 11, fontWeight: 800, color: 'rgba(255,255,255,0.4)', whiteSpace: 'nowrap' } }, exTargetText(ex))
          ),
          ex.note ? e('div', { style: { fontSize: 11, color: 'rgba(255,255,255,0.5)', marginTop: 4, lineHeight: 1.45 } }, ex.note) : null,
          prev ? e('div', { style: { fontSize: 11, color: '#5EEAD4', marginTop: 6, fontWeight: 700 } },
            'Last time: ' + prev.sets.map(s => s.secs != null ? s.secs + 's' : (s.weight != null ? s.weight + '×' + (s.reps != null ? s.reps : '—') : (s.reps != null ? s.reps : '—'))).join(', ')
          ) : null,
          // logged set pills
          arr.some(s => s.done) ? e('div', { style: { display: 'flex', flexWrap: 'wrap', gap: 6, marginTop: 8 } },
            ...arr.filter(s => s.done).map((s, i) => e('div', { key: i, className: 'chip', style: { background: 'rgba(16,185,129,0.18)', color: '#6EE7B7' } },
              '✓ ' + (s.secs != null ? s.secs + 's' : (s.weight != null ? s.weight + ' lb × ' + s.reps : s.reps + ' reps'))
            ))
          ) : null,
          // input row (hidden once every set is done)
          nextIdx === -1 ? e('div', { style: { fontSize: 12, color: '#6EE7B7', fontWeight: 800, marginTop: 10 } }, '✓ All sets logged')
            : e('div', { style: { marginTop: 10 } },
              prevForThis ? e('div', { style: { fontSize: 11, color: 'rgba(255,255,255,0.45)', marginBottom: 6, fontWeight: 700 } },
                'Set ' + nextSetNum + ' last time: ' + (prevForThis.secs != null ? prevForThis.secs + 's' : (prevForThis.weight != null ? prevForThis.weight + ' lb × ' + prevForThis.reps : prevForThis.reps + ' reps'))
              ) : null,
              e('div', { style: { display: 'flex', gap: 8, alignItems: 'stretch' } },
                ex.type === 'weight' ? e('input', { type: 'number', inputMode: 'decimal', placeholder: 'lb', value: d.weight == null ? '' : d.weight,
                  onInput: ev => setDraftField(ex.name, 'weight', ev.target.value),
                  style: liveInput }) : null,
                ex.type === 'time'
                  ? e('input', { type: 'number', inputMode: 'numeric', placeholder: 'sec', value: running ? runSecs : (d.secs == null ? '' : d.secs),
                      onInput: ev => setDraftField(ex.name, 'secs', ev.target.value), style: liveInput })
                  : e('input', { type: 'number', inputMode: 'numeric', placeholder: 'reps', value: d.reps == null ? '' : d.reps,
                      onInput: ev => setDraftField(ex.name, 'reps', ev.target.value), style: liveInput }),
                ex.type === 'time' ? e('button', { onClick: () => toggleTimer(ex.name),
                  style: { padding: '0 14px', borderRadius: 12, border: 'none', background: running ? '#EF4444' : 'rgba(255,255,255,0.16)', color: '#fff', fontSize: 13, fontWeight: 800, cursor: 'pointer', whiteSpace: 'nowrap' } }, running ? '■ Stop' : '▶ Start') : null,
                e('button', { onClick: () => logSet(ex),
                  style: { padding: '0 18px', borderRadius: 12, border: 'none', background: 'linear-gradient(135deg,' + ACCENT + ',' + PURPLE + ')', color: '#fff', fontSize: 14, fontWeight: 800, cursor: 'pointer' } }, 'Log')
              ),
              errors[ex.name] ? e('div', { style: { fontSize: 11, color: '#FCA5A5', marginTop: 6, fontWeight: 700 } }, errors[ex.name]) : null
            )
        );
      })
    ),
    // finish
    e('div', { style: { padding: '10px 16px calc(14px + env(safe-area-inset-bottom))', flexShrink: 0, borderTop: '1px solid rgba(255,255,255,0.08)' } },
      e('button', { onClick: finish, disabled: doneSets === 0,
        style: { width: '100%', padding: 15, borderRadius: 14, border: 'none', fontSize: 15, fontWeight: 800, fontFamily: 'inherit',
          background: doneSets === 0 ? 'rgba(255,255,255,0.12)' : 'linear-gradient(135deg,' + GREEN + ',#059669)', color: '#fff', cursor: doneSets === 0 ? 'default' : 'pointer' } },
        'Finish Workout')
    )
  );
}
const liveInput = { flex: 1, minWidth: 0, width: '100%', padding: '13px 12px', borderRadius: 12, border: '1px solid rgba(255,255,255,0.18)', background: 'rgba(255,255,255,0.06)', color: '#fff', fontSize: 16, fontFamily: 'inherit', outline: 'none' };

// ── Workout screen (today's session) ────────────────────────────────────────
function WorkoutScreen({ program, workoutLog, workoutCount, onStart }) {
  const [showAccessory, setShowAccessory] = useState(false);
  const dayLabel = nextDayLabel(workoutCount);
  const day = (program.days || []).find(d => d.dayLabel === dayLabel) || program.days[0];
  const main = (day.exercises || []).filter(ex => !ex.accessory);
  const accessory = (day.exercises || []).filter(ex => ex.accessory);
  const td = today();
  const loggedToday = (workoutLog[td] || []).some(s => s.programDay === day.dayLabel);
  const pct = Math.round((positionInBlock(workoutCount) - 1) / BLOCK_LENGTH * 100);

  return e('div', { style: { padding: 16 } },
    // block progress
    e('div', { className: 'card' },
      e('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 8 } },
        e('div', { style: { fontSize: 12, fontWeight: 800, color: TEXT } }, blockNumber(workoutCount) === 1 ? 'Month 1' : 'Block ' + blockNumber(workoutCount)),
        e('div', { style: { fontSize: 12, fontWeight: 800, color: PURPLE } }, positionInBlock(workoutCount) + ' / ' + BLOCK_LENGTH)
      ),
      e('div', { style: { height: 6, background: CARD2, borderRadius: 3, overflow: 'hidden' } },
        e('div', { style: { height: '100%', width: pct + '%', background: 'linear-gradient(90deg,' + ACCENT + ',' + PURPLE + ')' } })
      ),
      e('div', { style: { fontSize: 11, color: MUTED, marginTop: 8, lineHeight: 1.5 } }, 'Show up and log clean reps. Weight goes up when the coach says so — not because a week passed.')
    ),

    // today's workout hero
    e('div', { style: { background: 'linear-gradient(135deg,#1A1040,#2D1B6B)', borderRadius: 20, padding: 20, marginBottom: 12 } },
      e('div', { style: { fontSize: 11, fontWeight: 800, color: 'rgba(255,255,255,0.5)', letterSpacing: 1, marginBottom: 6 } },
        'WORKOUT ' + (workoutCount + 1) + ' OF ' + BLOCK_LENGTH),
      e('div', { style: { fontSize: 22, fontWeight: 900, color: '#fff', marginBottom: 4 } }, day.dayLabel),
      e('div', { style: { fontSize: 12, color: ACCENT, fontWeight: 700, marginBottom: 14 } }, (day.focus || []).join('  ·  ')),
      ...main.map(ex => {
        const ready = progressReady(workoutLog, day.dayLabel, ex);
        const prev = prevSetsForExercise(workoutLog, day.dayLabel, ex.name);
        return e('div', { key: ex.name, style: { padding: '8px 0', borderTop: '1px solid rgba(255,255,255,0.08)' } },
          e('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', gap: 8 } },
            e('div', { style: { fontSize: 13, color: '#fff', fontWeight: 700 } }, ex.name),
            e('div', { style: { fontSize: 11, color: 'rgba(255,255,255,0.45)', fontWeight: 700, whiteSpace: 'nowrap' } }, exTargetText(ex))
          ),
          e('div', { style: { display: 'flex', gap: 8, marginTop: 3, flexWrap: 'wrap' } },
            prev ? e('div', { style: { fontSize: 10.5, color: '#5EEAD4', fontWeight: 700 } },
              'last: ' + prev.sets.map(s => s.secs != null ? s.secs + 's' : (s.weight != null ? s.weight + '×' + s.reps : s.reps)).join(', ')) : null,
            ready ? e('div', { className: 'chip', style: { background: 'rgba(16,185,129,0.2)', color: '#6EE7B7', padding: '2px 8px' } }, '⬆︎ Clean 3×10 — ready to add weight') : null
          ),
          ex.note ? e('div', { style: { fontSize: 10.5, color: 'rgba(255,255,255,0.4)', marginTop: 3, lineHeight: 1.4 } }, ex.note) : null
        );
      }),
      e('button', { onClick: () => setShowAccessory(v => !v),
        style: { marginTop: 12, background: 'none', border: 'none', color: 'rgba(255,255,255,0.55)', fontSize: 11, fontWeight: 800, cursor: 'pointer', padding: 0 } },
        (showAccessory ? '▾ ' : '▸ ') + 'Every-session work — ' + accessory.length + ' drills (~5 min)'),
      showAccessory ? e('div', { style: { marginTop: 8 } },
        ...accessory.map(ex => e('div', { key: ex.name, style: { padding: '6px 0', borderTop: '1px solid rgba(255,255,255,0.06)' } },
          e('div', { style: { display: 'flex', justifyContent: 'space-between', gap: 8 } },
            e('div', { style: { fontSize: 12, color: 'rgba(255,255,255,0.8)', fontWeight: 600 } }, ex.name),
            e('div', { style: { fontSize: 10.5, color: 'rgba(255,255,255,0.4)', fontWeight: 700, whiteSpace: 'nowrap' } }, exTargetText(ex))
          ),
          ex.note ? e('div', { style: { fontSize: 10, color: 'rgba(255,255,255,0.38)', marginTop: 2, lineHeight: 1.4 } }, ex.note) : null
        ))
      ) : null
    ),

    loggedToday ? e('div', { className: 'card', style: { display: 'flex', alignItems: 'center', gap: 10, background: 'rgba(16,185,129,0.08)', borderColor: 'rgba(16,185,129,0.3)' } },
      e('div', { style: { fontSize: 18 } }, '✓'),
      e('div', { style: { fontSize: 13, fontWeight: 700, color: '#047857' } }, day.dayLabel + ' already logged today. Nice work.')
    ) : null,

    e('button', { className: 'btn-primary', onClick: () => onStart(day),
      style: { boxShadow: '0 8px 22px rgba(123,47,255,0.3)' } },
      (loggedToday ? '▶ Start Another ' : '▶ Start ') + day.dayLabel)
  );
}

// ── History screen ─────────────────────────────────────────────────────────
function HistoryScreen({ workoutLog, onDelete }) {
  const [open, setOpen] = useState({});
  const dates = Object.keys(workoutLog || {}).filter(d => (workoutLog[d] || []).length).sort().reverse();

  const total = dates.reduce((n, d) => n + workoutLog[d].length, 0);
  const wkAgo = new Date(); wkAgo.setDate(wkAgo.getDate() - 7);
  const wkStr = wkAgo.getFullYear() + '-' + String(wkAgo.getMonth() + 1).padStart(2, '0') + '-' + String(wkAgo.getDate()).padStart(2, '0');
  const thisWeek = dates.filter(d => d >= wkStr).reduce((n, d) => n + workoutLog[d].length, 0);

  return e('div', { style: { padding: 16 } },
    e('div', { className: 'card', style: { display: 'flex', gap: 12 } },
      e('div', { style: { flex: 1, textAlign: 'center' } },
        e('div', { className: 'grad', style: { fontSize: 24, fontWeight: 900 } }, total),
        e('div', { style: { fontSize: 10, color: MUTED, fontWeight: 700, textTransform: 'uppercase', letterSpacing: 0.5 } }, 'Workouts')
      ),
      e('div', { style: { width: 1, background: BORDER } }),
      e('div', { style: { flex: 1, textAlign: 'center' } },
        e('div', { className: 'grad', style: { fontSize: 24, fontWeight: 900 } }, thisWeek),
        e('div', { style: { fontSize: 10, color: MUTED, fontWeight: 700, textTransform: 'uppercase', letterSpacing: 0.5 } }, 'Last 7 days')
      )
    ),

    dates.length === 0 ? e('div', { className: 'card', style: { textAlign: 'center', color: MUTED, fontSize: 13, padding: 28 } },
      'No workouts logged yet. Start one from the Workout tab.') : null,

    ...dates.map(dt => {
      const label = new Date(dt + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
      return e('div', { key: dt, className: 'card', style: { padding: 0, overflow: 'hidden' } },
        ...workoutLog[dt].map((s, si) => {
          const key = dt + ':' + s.id;
          const isOpen = open[key];
          const mainCount = (s.exercises || []).filter(x => !x.accessory).length;
          return e('div', { key: s.id, style: { borderTop: si ? '1px solid ' + BORDER : 'none' } },
            e('button', { onClick: () => setOpen(o => Object.assign({}, o, { [key]: !o[key] })),
              style: { width: '100%', display: 'flex', alignItems: 'center', gap: 10, padding: 14, background: 'none', border: 'none', cursor: 'pointer', fontFamily: 'inherit', textAlign: 'left' } },
              e('div', { className: 'chip', style: { background: 'rgba(16,185,129,0.15)', color: '#047857' } }, '✓'),
              e('div', { style: { flex: 1 } },
                e('div', { style: { fontSize: 13, fontWeight: 800, color: TEXT } }, s.programDay || 'Workout'),
                e('div', { style: { fontSize: 11, color: MUTED, fontWeight: 600 } }, label + '  ·  ' + mainCount + ' lifts' + (s.duration ? '  ·  ' + s.duration + ' min' : ''))
              ),
              e('div', { style: { color: MUTED, fontSize: 12 } }, isOpen ? '▲' : '▼')
            ),
            isOpen ? e('div', { style: { padding: '0 14px 14px' } },
              ...(s.exercises || []).map(x => e('div', { key: x.name, style: { display: 'flex', justifyContent: 'space-between', gap: 10, padding: '5px 0', fontSize: 12 } },
                e('div', { style: { color: x.accessory ? MUTED : TEXT, fontWeight: x.accessory ? 500 : 700 } }, x.name),
                e('div', { style: { color: MUTED, fontWeight: 600, textAlign: 'right' } },
                  (x.allSets || []).map(v => v.secs != null ? v.secs + 's' : (v.weight != null ? v.weight + '×' + v.reps : (v.reps != null ? v.reps : '—'))).join(', ') || '—')
              )),
              e('button', { onClick: () => { if (confirm('Delete this logged workout?')) onDelete(dt, s.id); },
                style: { marginTop: 8, background: 'none', border: 'none', color: '#EF4444', fontSize: 11, fontWeight: 800, cursor: 'pointer', padding: 0 } }, 'Delete')
            ) : null
          );
        })
      );
    })
  );
}

// ── Settings sheet (Push / Restore cloud) ───────────────────────────────────
function SettingsSheet({ onClose }) {
  const [msg, setMsg] = useState('');
  const last = localStorage.getItem(LS + 'lastCloudSync');
  return e('div', { style: { position: 'fixed', inset: 0, zIndex: 500, display: 'flex', flexDirection: 'column', justifyContent: 'flex-end' } },
    e('div', { onClick: onClose, style: { position: 'absolute', inset: 0, background: 'rgba(0,0,0,0.5)' } }),
    e('div', { style: { position: 'relative', background: '#fff', borderRadius: '20px 20px 0 0', padding: '20px', paddingBottom: 'calc(20px + env(safe-area-inset-bottom))' } },
      e('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 4 } },
        e('div', { style: { fontSize: 15, fontWeight: 900, color: TEXT } }, 'Cloud sync'),
        e('button', { onClick: onClose, style: { background: 'none', border: 'none', fontSize: 20, color: MUTED, cursor: 'pointer' } }, '✕')
      ),
      e('div', { style: { fontSize: 12, color: MUTED, marginBottom: 14, lineHeight: 1.5 } },
        'Every change saves to the cloud automatically. Use these if you switched phones or want to force it.' +
        (last ? '  Last sync: ' + new Date(last).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '')),
      msg ? e('div', { style: { fontSize: 12, fontWeight: 700, color: '#047857', marginBottom: 10 } }, msg) : null,
      e('div', { style: { display: 'flex', gap: 10 } },
        e('button', { className: 'btn-primary', style: { flex: 1 }, onClick: () => {
          setMsg('Pushing…');
          pushAllToSupabase().then(() => { localStorage.setItem(LS + 'lastCloudSync', new Date().toISOString()); setMsg('✓ Pushed to cloud'); });
        } }, '☁️ Push to Cloud'),
        e('button', { className: 'btn-ghost', style: { flex: 1, color: TEXT }, onClick: () => {
          setMsg('Restoring…');
          syncFromSupabase().then(() => { setMsg('✓ Restored — reloading'); setTimeout(() => location.reload(), 900); });
        } }, '🔄 Restore')
      )
    )
  );
}

// ── App ────────────────────────────────────────────────────────────────────
function App() {
  const [tab, setTab] = useState('workout');            // workout | history
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [program, setProgram] = useState(() => load('currentProgram'));
  const [workoutLog, setWorkoutLog] = useState(() => load('workoutLog') || {});
  const [workoutCount, setWorkoutCount] = useState(() => load('workoutCount') || 0);
  const [live, setLive] = useState(() => {
    const w = readWip();
    return w ? { dayLabel: w.dayLabel, date: w.date } : null;
  });

  useEffect(() => {
    syncFromSupabase().then(pulled => {
      if (!pulled) return;
      setProgram(load('currentProgram'));
      setWorkoutLog(load('workoutLog') || {});
      setWorkoutCount(load('workoutCount') || 0);
    });
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  }, []);

  function startLive(day) { setLive({ dayLabel: day.dayLabel, date: today() }); }

  function finishLive(entry) {
    const nextLog = Object.assign({}, workoutLog, { [entry.date]: [...(workoutLog[entry.date] || []), entry] });
    setWorkoutLog(nextLog); save('workoutLog', nextLog);

    const nextCount = workoutCount + 1;
    setWorkoutCount(nextCount); save('workoutCount', nextCount);

    // roll last weight / reps / secs onto the program so next session pre-fills
    if (program) {
      const p = JSON.parse(JSON.stringify(program));
      p.days = p.days.map(d => {
        if (d.dayLabel !== entry.programDay) return d;
        d.exercises = d.exercises.map(ex => {
          const done = entry.exercises.find(x => x.name === ex.name);
          if (!done) return ex;
          return Object.assign({}, ex, {
            lastWeight: done.weight != null ? done.weight : ex.lastWeight,
            lastReps: done.reps != null ? done.reps : ex.lastReps,
            lastSecs: done.secs != null ? done.secs : ex.lastSecs,
            lastLogged: new Date().toISOString(),
          });
        });
        return d;
      });
      setProgram(p); save('currentProgram', p);
    }
    setLive(null);
    setTab('history');
  }

  function deleteSession(dt, id) {
    const dayArr = (workoutLog[dt] || []).filter(s => s.id !== id);
    const next = Object.assign({}, workoutLog);
    if (dayArr.length) next[dt] = dayArr; else delete next[dt];
    setWorkoutLog(next); save('workoutLog', next);
  }

  if (!program) {
    return e('div', { style: { padding: 40, textAlign: 'center', color: MUTED } }, 'Loading Cam’s program…');
  }

  if (live) {
    const day = (program.days || []).find(d => d.dayLabel === live.dayLabel) || program.days[0];
    return e('div', { id: 'app-inner', style: { height: '100%' } },
      e(LiveWorkout, { day, dateStr: live.date, workoutLog, onFinish: finishLive, onCancel: () => setLive(null) })
    );
  }

  return e('div', { id: 'app-inner', style: { display: 'flex', flexDirection: 'column', height: '100%' } },
    e('div', { className: 'header' },
      e('div', { style: { fontSize: 15, fontWeight: 800, color: TEXT } }, 'Cam ', e('span', { style: { color: MUTED, fontWeight: 600 } }, '· Strength')),
      e('button', { onClick: () => setSettingsOpen(true), title: 'Cloud sync',
        style: { background: 'none', border: 'none', cursor: 'pointer', fontSize: 18, color: MUTED, padding: '2px 4px' } }, '☁️')
    ),
    e('div', { className: 'content', style: { padding: 0 } },
      tab === 'workout'
        ? e(WorkoutScreen, { program, workoutLog, workoutCount, onStart: startLive })
        : e(HistoryScreen, { workoutLog, onDelete: deleteSession })
    ),
    e('nav', { className: 'nav' },
      e('button', { className: 'nav-btn' + (tab === 'workout' ? ' active' : ''), onClick: () => setTab('workout') },
        e('div', { style: { fontSize: 22, lineHeight: 1 } }, '🏋️'), 'Workout'),
      e('button', { className: 'nav-btn' + (tab === 'history' ? ' active' : ''), onClick: () => setTab('history') },
        e('div', { style: { fontSize: 22, lineHeight: 1 } }, '📋'), 'History')
    ),
    settingsOpen ? e(SettingsSheet, { onClose: () => setSettingsOpen(false) }) : null
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(e(App));
</script>
